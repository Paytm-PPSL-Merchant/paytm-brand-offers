<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#002970">
<title>Paytm EMI Offers</title>
<style>
  :root {
    --paytm-navy: #002970;
    --paytm-blue: #00baf2;
    --text: #1f2937;
    --muted: #64748b;
    --bg: #f3f8fc;
    --card: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    width: 100%;
    overflow-x: hidden;
    padding: clamp(16px, 5vw, 24px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(0, 186, 242, 0.18), transparent 34%),
      linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
  }

  .page {
    width: 100%;
    max-width: 560px;
    overflow: hidden;
    text-align: center;
    background: var(--card);
    border-radius: clamp(16px, 4vw, 24px);
    box-shadow: 0 20px 60px rgba(0, 41, 112, 0.14);
  }

  .brand-bar {
    padding: clamp(16px, 4vw, 22px) clamp(16px, 5vw, 24px);
    background: var(--paytm-navy);
  }

  .brand-title {
    display: inline-flex;
    flex-wrap: nowrap;
    align-items: baseline;
    justify-content: center;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #ffffff;
    line-height: 1.2;
    white-space: nowrap;
  }

  .brand-title .pay {
    color: #ffffff;
  }

  .brand-title .tm {
    color: var(--paytm-blue);
  }

  .brand-title .suffix {
    margin-left: 10px;
  }

  .content {
    padding: clamp(32px, 8vw, 48px) clamp(20px, 5vw, 32px) clamp(28px, 6vw, 40px);
  }

  h1 {
    margin-bottom: clamp(16px, 4vw, 24px);
    font-size: clamp(24px, 7vw, 40px);
    line-height: 1.15;
    color: var(--paytm-navy);
  }

  p {
    width: 100%;
    max-width: 430px;
    margin: 0 auto clamp(20px, 5vw, 28px);
    font-size: clamp(15px, 4vw, 16px);
    line-height: 1.7;
    color: var(--muted);
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 320px;
    min-height: 48px;
    padding: 0 clamp(20px, 5vw, 26px);
    border-radius: 999px;
    background: var(--paytm-navy);
    color: #ffffff;
    font-size: clamp(15px, 4vw, 16px);
    font-weight: 800;
    font-family: inherit;
    text-decoration: none;
    box-shadow: 0 12px 24px rgba(0, 41, 112, 0.22);
    transition: transform 0.2s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .button:hover {
    background: #003b99;
    transform: translateY(-2px);
  }

  .button:active {
    transform: scale(0.98);
  }

  .button:focus-visible {
    outline: 3px solid rgba(0, 186, 242, 0.55);
    outline-offset: 4px;
  }

  .note {
    margin-top: clamp(14px, 3vw, 18px);
    margin-bottom: 0;
    font-size: clamp(12px, 3.5vw, 13px);
    padding: 0 4px;
  }
</style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <div class="brand-bar">
      <div class="brand-title"><span class="pay">Pay</span><span class="tm">tm</span><span class="suffix">EMI Offers</span></div>
    </div>

    <section class="content">
      <h1 id="page-title">We have moved to a new website</h1>
      <p>
        Paytm EMI offers are now available on our updated business website.
        Click below to continue.
      </p>
      <a class="button" href="https://business.paytm.com/emi-offers/" target="_blank" rel="noopener">
        Open New Website
      </a>
      <p class="note">You will be taken to business.paytm.com.</p>
    </section>
  </main>
</body>
</html>
